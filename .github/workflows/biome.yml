name: Biome Lint
permissions:
  contents: read
  packages: read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/biome.yml'
      - 'src/**/*.ts'
      - '__tests__/**/*.ts'
      - 'biome.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/biome.yml'
      - 'src/**/*.ts'
      - '__tests__/**/*.ts'
      - 'biome.json'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  biome:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm biome
