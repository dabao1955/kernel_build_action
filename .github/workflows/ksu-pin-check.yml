name: Bump pinned setup revisions

# The KernelSU fork / NoMount setup scripts executed by this action are pinned
# to immutable commit SHAs in src/patches.ts. This workflow compares each
# pinned SHA against the head of the branch it tracks, updates src/patches.ts,
# rebuilds dist/, and commits the bump to main as root@localhost.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-pinned-setup-revisions
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Update pinned SHAs from upstream branch heads
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "changed=false" >> "$GITHUB_OUTPUT"

          # lowercase fork key -> "Proper/Repo tracked-branch"
          declare -A TRACK=(
            [backslashxx/kernelsu]='backslashxx/KernelSU master'
            [rsuntk/kernelsu]='rsuntk/KernelSU main'
            [sukisu-ultra/sukisu-ultra]='SukiSU-Ultra/SukiSU-Ultra main'
            [shirkneko/sukisu-ultra]='ShirkNeko/SukiSU-Ultra main'
            [kernelsu-next/kernelsu-next]='KernelSU-Next/KernelSU-Next dev'
            [resukisu/resukisu]='ReSukiSU/ReSukiSU main'
            [tiann/kernelsu]='tiann/KernelSU main'
            [maxsteeel/nomount]='maxsteeel/nomount dev'
          )

          re_entry="^ *'([-a-zA-Z0-9_.]+/[-a-zA-Z0-9_.]+)': \{"
          re_sha="setupSha: '([0-9a-f]{40})'"
          re_upstream="KSU_UPSTREAM_SHA = '([0-9a-f]{40})'"
          re_nomount="maxsteeel/nomount/raw/([0-9a-f]{40})/kernel/setup\.sh"

          pins=()
          repo=''
          while IFS= read -r line; do
            if [[ $line =~ $re_entry ]]; then
              repo="${BASH_REMATCH[1]}"
            elif [[ -n $repo && $line =~ $re_sha ]]; then
              pins+=("${repo}=${BASH_REMATCH[1]}")
              repo=''
            elif [[ $line =~ $re_upstream ]]; then
              pins+=("tiann/kernelsu=${BASH_REMATCH[1]}")
            elif [[ $line =~ $re_nomount ]]; then
              pins+=("maxsteeel/nomount=${BASH_REMATCH[1]}")
            fi
          done < src/patches.ts

          if [[ ${#pins[@]} -ne ${#TRACK[@]} ]]; then
            echo "::error::Expected ${#TRACK[@]} pinned revisions in src/patches.ts, found ${#pins[@]}. Update the TRACK map in this workflow."
            exit 1
          fi

          : > /tmp/pin-updates.tsv
          printf '%s\n\n' 'ci: chore(pins): Bump pinned setup-script revisions' > /tmp/pin-bump-message

          changed=0
          for pin in "${pins[@]}"; do
            key="${pin%%=*}"
            sha="${pin##*=}"
            # The count check above misses a *replaced* fork key (same total,
            # unknown key); guard the lookup so we fail with the intended
            # map-update error instead of an unbound-variable abort.
            if [[ -z "${TRACK[$key]:-}" ]]; then
              echo "::error::No branch mapping for '${key}' in the TRACK map of this workflow."
              exit 1
            fi
            read -r display branch <<< "${TRACK[$key]}"
            head="$(gh api "repos/${display}/commits/${branch}" --jq .sha)"
            if [[ "$head" != "$sha" ]]; then
              echo "DRIFT: ${display}@${branch} pinned ${sha:0:12}, upstream ${head:0:12}"
              printf '%s\t%s\t%s\n' "$key" "$sha" "$head" >> /tmp/pin-updates.tsv
              echo "- ${display}@${branch}: ${sha:0:12} -> ${head:0:12}" >> /tmp/pin-bump-message
              changed=1
            else
              echo "ok: ${display}@${branch} ${sha:0:12}"
            fi
          done

          if [[ $changed -eq 0 ]]; then
            echo "All pinned setup-script revisions are current."
            exit 0
          fi

          while IFS=$'\t' read -r key old new; do
            case "$key" in
              tiann/kernelsu)
                sed -i "s/KSU_UPSTREAM_SHA = '${old}'/KSU_UPSTREAM_SHA = '${new}'/" src/patches.ts
                ;;
              maxsteeel/nomount)
                sed -i "s|maxsteeel/nomount/raw/${old}/kernel/setup.sh|maxsteeel/nomount/raw/${new}/kernel/setup.sh|" src/patches.ts
                ;;
              *)
                awk -v key="$key" -v old="$old" -v new="$new" '
                  BEGIN { in_entry = 0 }
                  {
                    if ($0 ~ "^ *\047" key "\047: \\{") {
                      in_entry = 1
                      print
                      next
                    }
                    if (in_entry && $0 ~ /^ *\047[-a-zA-Z0-9_.]+\/[-a-zA-Z0-9_.]+\047: \{/) {
                      in_entry = 0
                    }
                    if (in_entry && index($0, "setupSha: \047" old "\047")) {
                      sub("setupSha: \047" old "\047", "setupSha: \047" new "\047")
                      in_entry = 0
                    }
                    print
                  }
                ' src/patches.ts > src/patches.ts.tmp
                mv src/patches.ts.tmp src/patches.ts
                ;;
            esac
            if ! grep -Fq "$new" src/patches.ts; then
              echo "::error::Failed to write new SHA for ${key}"
              exit 1
            fi
          done < /tmp/pin-updates.tsv

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.bump.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Rebuild action
        if: steps.bump.outputs.changed == 'true'
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Commit and push to main
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "root"
          git config user.email "root@localhost"
          git add src/patches.ts dist/
          if git diff --cached --quiet; then
            echo "Working tree already matches upstream pins after rebuild."
            exit 0
          fi
          git commit -F /tmp/pin-bump-message
          git pull --rebase origin main
          git push origin HEAD:main
